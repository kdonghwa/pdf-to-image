<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>PDF → 이미지 변환</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-33812YN2Q0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-33812YN2Q0');
  </script>

  <style>
    :root {
      --bg-main: #f4fffb;
      --bg-sub: #e6fffa;
      --bg-card: #ffffff;
      --border: #c7f9ee;
      --mint: #5eead4;
      --mint-strong: #2dd4bf;
      --mint-hover: #14b8a6;
      --text-main: #134e4a;
      --text-sub: #3a7f77;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: var(--bg-main);
      color: var(--text-main);
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-sub);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 18px;
      margin: 0;
    }

    /* 🔥 버튼 공통 스타일 */
    .btn {
      background: var(--mint-strong);
      border: none;
      color: #043a36;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, transform .05s;
    }

    .btn:hover {
      background: var(--mint-hover);
      color: #ffffff;
    }

    .btn:active {
      transform: translateY(1px);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .drop-zone {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }

    .drop-zone.dragover {
      background: rgba(45, 212, 191, 0.12);
    }

    .center {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .list {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      overflow-y: auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .card span {
      font-size: 13px;
      color: var(--text-sub);
    }

    .empty {
      text-align: center;
      opacity: 0.85;
    }

    footer {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-sub);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .notice {
      opacity: 0.8;
      max-width: 70%;
      line-height: 1.4;
      color: var(--text-sub);
    }

    input { display: none; }
  </style>
</head>
<body>

<div class="app">

  <header>
    <h1>🌱 PDF → 이미지 변환</h1>
    <!-- 🔥 초기화 버튼도 동일 스타일 -->
    <button id="resetBtn" class="btn">초기화</button>
  </header>

  <main>
    <div id="dropZone" class="drop-zone">
      <div class="empty">
        <h2>PDF 파일을 드래그 & 드롭</h2>
        <p>또는 클릭해서 선택</p>
        <div id="status"></div>
      </div>
      <input id="fileInput" type="file" accept="application/pdf">
    </div>

    <div id="center" class="center" style="display:none;">
      <div id="list" class="list"></div>
    </div>
  </main>

  <footer id="footer" style="display:none;">
    <div class="notice">
      업로드된 PDF 파일은 사용자 브라우저에서만 처리되며 서버로 전송·저장되지 않습니다.<br>
      파일의 저작권 및 사용 책임은 업로드한 사용자에게 있습니다.
    </div>
    <!-- 🔥 전체 다운로드 버튼 -->
    <button id="downloadAll" class="btn">📦 전체 ZIP 다운로드</button>
  </footer>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const MAX_FILE_SIZE = 50 * 1024 * 1024;
const MAX_PAGES = 200;
const SCALE = 2;

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const list = document.getElementById("list");
const center = document.getElementById("center");
const footer = document.getElementById("footer");
const status = document.getElementById("status");
const resetBtn = document.getElementById("resetBtn");
const downloadAllBtn = document.getElementById("downloadAll");

let images = [];
let fileBaseName = "";

dropZone.onclick = () => fileInput.click();

document.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

document.addEventListener("dragleave", e => {
  if (e.clientX === 0) dropZone.classList.remove("dragover");
});

document.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files[0]) handlePDF(e.dataTransfer.files[0]);
});

fileInput.onchange = e => {
  if (e.target.files[0]) handlePDF(e.target.files[0]);
};

resetBtn.onclick = reset;

function reset() {
  images = [];
  list.innerHTML = "";
  status.textContent = "";
  center.style.display = "none";
  footer.style.display = "none";
  dropZone.style.display = "flex";
  fileInput.value = "";
}

async function handlePDF(file) {
  if (file.type !== "application/pdf") return alert("PDF만 업로드 가능합니다.");
  if (file.size > MAX_FILE_SIZE) return alert("50MB 이하 PDF만 지원합니다.");

  fileBaseName = file.name.replace(/\.pdf$/i, "");
  images = [];
  list.innerHTML = "";

  dropZone.style.display = "none";
  center.style.display = "flex";
  footer.style.display = "flex";
  status.textContent = "⏳ PDF 로딩 중...";

  const pdf = await pdfjsLib.getDocument({
    data: await file.arrayBuffer()
  }).promise;

  if (pdf.numPages > MAX_PAGES) {
    alert(`페이지 수 ${MAX_PAGES} 초과`);
    reset();
    return;
  }

  for (let i = 1; i <= pdf.numPages; i++) {
    status.textContent = `📄 ${i} / ${pdf.numPages} 변환 중`;

    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: SCALE });

    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: canvas.getContext("2d"),
      viewport
    }).promise;

    const url = canvas.toDataURL("image/png");
    images.push({ page: i, url });
    createCard(i, url);
  }

  status.textContent = "✅ 변환 완료";
}

function createCard(page, url) {
  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = url;

  const label = document.createElement("span");
  label.textContent = `페이지 ${page} 다운로드`;

  card.appendChild(img);
  card.appendChild(label);

  card.onclick = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = `${fileBaseName}-page-${page}.png`;
    a.click();
  };

  list.appendChild(card);
}

downloadAllBtn.onclick = async () => {
  const zip = new JSZip();
  images.forEach(img =>
    zip.file(
      `${fileBaseName}-page-${img.page}.png`,
      img.url.split(",")[1],
      { base64: true }
    )
  );

  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${fileBaseName}.zip`;
  a.click();
};
</script>

</body>
</html>
